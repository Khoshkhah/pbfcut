[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pbfcut"
description = "Cut an OpenStreetMap .osm.pbf file into map tiles, H3 cells or areas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/Khoshkhah/pbfcut"
Documentation = "https://khoshkhah.github.io/pbfcut/manual/reference/python/"

[tool.maturin]
module-name = "pbfcut"
