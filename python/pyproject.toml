[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pbfcut"
description = "Cut an OpenStreetMap .osm.pbf file into map tiles, H3 cells or areas"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["openstreetmap", "osm", "pbf", "tiles", "h3", "extract", "gis"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/Khoshkhah/pbfcut"
Documentation = "https://khoshkhah.github.io/pbfcut/manual/reference/python/"
Source = "https://github.com/Khoshkhah/pbfcut"
Issues = "https://github.com/Khoshkhah/pbfcut/issues"
"Browser page" = "https://khoshkhah.github.io/pbfcut/"

[tool.maturin]
module-name = "pbfcut"
