site_name: pbfcut
site_url: https://khoshkhah.github.io/pbfcut/manual/
repo_url: https://github.com/Khoshkhah/pbfcut
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - assets/extra.css
# the plan of the project is for developers: on GitHub, not on the site
exclude_docs: |
  design.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Tutorials:
      - Cut a file into tiles: tutorials/cut-to-tiles.md
      - Cut a file into H3 cells: tutorials/cut-to-h3-cells.md
      - Cut a file in your browser: tutorials/online-page.md
  - Reference:
      - The command line: reference/cli.md
  - Explanation:
      - The rules of the cut: explanation/rules.md
      - Speed and memory: explanation/speed-and-memory.md
