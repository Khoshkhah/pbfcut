# Makes tests/golden/duckosm-e3ce06a.txt from the tile cut of duckOSM at the commit where pbfcut started (docs/design.md,
# section 7). Run it one time; the golden file never changes to make a test pass.
#   cargo run --release --manifest-path tools/golden/Cargo.toml -- tests/data > tests/golden/duckosm-e3ce06a.txt
[package]
name = "pbfcut-golden"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
duckosm-core = { git = "https://github.com/Khoshkhah/duckOSM.git", rev = "e3ce06a" }
