name: Pages

# The manual at https://khoshkhah.github.io/pbfcut/manual/. The online page comes to the root in M5 (docs/design.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs==1.6.*" "mkdocs-material==9.*"
      - run: mkdocs build --strict --site-dir site/manual
      - name: The root goes to the manual until the online page exists
        run: echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=manual/"><title>pbfcut</title><a href="manual/">pbfcut manual</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
