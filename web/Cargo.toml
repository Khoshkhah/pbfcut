[package]
name = "pbfcut-web"
version = "0.2.2"
edition = "2021"
license = "MIT"
publish = false
description = "The browser page of pbfcut: the cut in WebAssembly, with the temporary files in OPFS"

[lib]
crate-type = ["cdylib"]

[dependencies]
pbfcut = { path = ".." }
# one version with the wasm-bindgen command of build.sh and of the workflows
wasm-bindgen = "=0.2.129"
# the CRC-32 of each file for the .zip, computed while the cut writes it (pure Rust, also wasm32)
crc32fast = "1"
# the names of the outlines of the map, as JSON strings
serde_json = "1"
# rayon on Web Workers: only in the build with the feature "threads" (nightly Rust, a cross-origin isolated page)
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[features]
threads = ["dep:wasm-bindgen-rayon"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
