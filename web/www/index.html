<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pbfcut online</title>
<meta name="description" content="Cut an OpenStreetMap .osm.pbf file into map tiles in your browser.">
<!-- GitHub Pages cannot send the COOP and COEP headers that threads need: this service worker adds them -->
<script src="coi-serviceworker.js?v=dev"></script>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb; --field: #f3f4f6;
          --accent: #2563eb; --accent-soft: #dbe7fe; --ok: #16a34a; --bad: #dc2626; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #8b93a1; --line: #262a33; --field: #1f232b;
            --accent: #6ea0ff; --accent-soft: #1d2a45; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
  }
  :root[data-theme=dark] { --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #8b93a1; --line: #262a33; --field: #1f232b;
            --accent: #6ea0ff; --accent-soft: #1d2a45; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  nav a { color: var(--muted); text-decoration: none; margin-left: 14px; font-size: .9rem; }
  nav a:hover, #theme:hover { color: var(--accent); }
  #theme { background: none; border: 0; padding: 0 0 0 14px; color: var(--muted); font-size: 1rem; line-height: 1; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
  h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  a { color: var(--accent); }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  input[type=number], #region { width: 100%; padding: 9px 11px; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid transparent; border-radius: 9px; outline: none; }
  select { width: 100%; padding: 9px 11px; font: inherit; color: var(--text); background: var(--field); border: 1px solid transparent;
    border-radius: 9px; outline: none; }
  select:focus { border-color: var(--accent); }
  input[type=number]:focus, #region:focus { border-color: var(--accent); background: var(--card); }
  input[type=file] { font: inherit; font-size: .85rem; color: var(--muted); max-width: 100%; }
  input[type=file]::file-selector-button { font: inherit; font-size: .85rem; padding: 6px 12px; margin-right: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); cursor: pointer; }
  /* the switch region / file */
  .switch { display: inline-flex; background: var(--field); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch label { margin: 0; padding: 6px 14px; border-radius: 8px; font-size: .88rem; color: var(--muted); cursor: pointer; }
  .switch input:checked + label { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .switch input:focus-visible + label { outline: 2px solid var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button, a.button { font: inherit; font-size: .92rem; font-weight: 500; padding: 9px 18px; border-radius: 9px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
  button.secondary, a.button.secondary { background: transparent; color: var(--accent); }
  a.button.disabled { opacity: .45; pointer-events: none; }
  button:disabled { opacity: .4; cursor: default; }
  #start { min-width: 120px; }
  .hint { color: var(--muted); font-size: .82rem; margin: 8px 0 0; }
  .hint:empty { display: none; }
  progress { width: 100%; height: 6px; margin-top: 10px; appearance: none; border: 0; border-radius: 3px; background: var(--field); overflow: hidden; }
  progress::-webkit-progress-bar { background: var(--field); }
  progress::-webkit-progress-value { background: var(--accent); }
  /* progress */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stats div { background: var(--field); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stats span { display: block; font-size: .72rem; color: var(--muted); }
  .stats b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 4px; background: var(--field); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  ol.steps { list-style: none; padding: 0; margin: 0; font-size: .88rem; }
  ol.steps li { display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; padding: 5px 0; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  ol.steps li span:first-child { font-family: ui-monospace, monospace; font-size: .8rem; padding-top: 1px; }
  ol.steps li b { font-weight: 400; }
  ol.steps li.done { color: var(--text); }
  ol.steps li small.io { display: block; font-size: .75rem; color: var(--muted); }
  ol.steps li small.io:empty { display: none; }
  ol.steps li.done span:first-child { color: var(--ok); }
  ol.steps li.run { color: var(--accent); }
  ol.steps li.run b { font-weight: 600; }
  .err { color: var(--bad); white-space: pre-wrap; font-size: .88rem; margin: 10px 0 0; }
  /* result */
  #summary { margin: 0; font-size: .95rem; }
  .table { overflow: auto; max-height: 380px; margin-top: 14px; border-top: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .85rem; }
  th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 500; font-size: .75rem; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td a { text-decoration: none; }
  button.help { width: 18px; height: 18px; padding: 0; margin-left: 4px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--field); color: var(--muted); font-size: .7rem; font-weight: 600; line-height: 16px; vertical-align: 1px; }
  button.help:hover { color: var(--accent); border-color: var(--accent); }
  dialog { max-width: min(440px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
    background: var(--card); color: var(--text); box-shadow: 0 10px 40px rgb(0 0 0 / .25); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  dialog h3 { margin: 0 0 14px; font-size: 1.05rem; }
  dialog dl { margin: 0; }
  dialog dt { font-weight: 600; font-size: .88rem; padding-top: 10px; border-top: 1px solid var(--line); }
  dialog dt:first-child { border-top: 0; padding-top: 0; }
  dialog dd { margin: 2px 0 10px; font-size: .86rem; color: var(--muted); }
  dialog form { text-align: right; margin-top: 6px; }
  label.check { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-size: .88rem; color: var(--text); cursor: pointer; }
  label.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  /* the matches of the region search */
  .combo { position: relative; }
  #region-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); }
  #region-list li { padding: 7px 10px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  #region-list li span { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #region-list li[aria-selected=true] { background: var(--accent-soft); }
  #region-list li.none { color: var(--muted); cursor: default; }
  /* the map of the plan, before the cut */
  #map { height: 300px; margin-top: 10px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--field); }
  #plan-text.bad { color: var(--bad); }
  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > .level { grid-column: 1 / -1; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    #start { flex: 1; }
    nav a { margin: 0 14px 0 0; }
  }
</style>
</head>
<body>
<main>
<header>
  <h1>pbfcut <span>online</span></h1>
  <nav><a href="manual/">Documentation</a><a href="https://github.com/Khoshkhah/pbfcut">GitHub</a><button id="theme" type="button" title="Light or dark" aria-label="Light or dark">◐</button></nav>
</header>

<section class="card">
  <h2>Input <button type="button" class="help" data-help="input" aria-label="Help">?</button></h2>
  <div class="switch">
    <input type="radio" name="src" value="region" id="src-r" checked><label for="src-r">Geofabrik region</label>
    <input type="radio" name="src" value="file" id="src-f"><label for="src-f">Local file</label>
  </div>
  <div id="src-region">
    <div class="combo">
      <input id="region" placeholder="Search a region, for example Monaco" autocomplete="off" aria-label="Region"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="region-list">
      <ul id="region-list" role="listbox" hidden></ul>
    </div>
    <div id="region-actions" hidden>
      <div class="row">
        <button id="get" type="button">Get</button>
        <a id="link" class="button secondary" href="#">Download</a>
        <button id="get-cancel" type="button" class="secondary" hidden>Cancel</button>
      </div>
      <p id="get-text" class="hint"></p>
      <progress id="get-bar" max="1" value="0" hidden></progress>
    </div>
  </div>
  <div id="src-file" hidden>
    <input id="file" type="file" accept=".pbf" aria-label="File">
  </div>
</section>

<section class="card">
  <h2>Settings <button type="button" class="help" data-help="settings" aria-label="Help">?</button></h2>
  <div class="switch">
    <input type="radio" name="kind" value="tiles" id="kind-t" checked><label for="kind-t">Tiles</label>
    <input type="radio" name="kind" value="h3" id="kind-h"><label for="kind-h">H3 cells</label>
    <input type="radio" name="kind" value="areas" id="kind-a"><label for="kind-a">Areas</label>
  </div>
  <div class="grid">
    <div class="level" data-kind="tiles"><label for="zoom">Zoom</label><select id="zoom"></select></div>
    <div class="level" data-kind="h3" hidden><label for="res">Resolution</label><select id="res"></select></div>
    <div data-kind="tiles h3"><label for="border">Border (m)</label><input id="border" type="number" min="0" step="1" value="0"></div>
    <div><label for="threads">Threads</label><input id="threads" type="number" min="1" max="64" value="4"></div>
  </div>
  <label class="check"><input id="compress" type="checkbox" checked> zlib compression</label>
  <div class="row" data-kind="areas" hidden>
    <label for="areas" style="margin:0">Areas</label>
    <input id="areas" type="file" accept=".geojson,.json">
  </div>
  <div class="row">
    <label for="boundary" style="margin:0">Boundary</label>
    <input id="boundary" type="file" accept=".geojson,.json,.poly,.wkt,.txt">
  </div>
  <p id="threads-hint" class="hint"></p>
  <div id="plan">
    <p id="plan-text" class="hint"></p>
    <div id="map" role="img" aria-label="The map of the tiles, cells or areas of the cut"></div>
  </div>
  <div class="row">
    <button id="start" type="button" disabled>Cut</button>
    <button id="stop" type="button" class="secondary" disabled>Stop</button>
  </div>
</section>

<section class="card" id="progress" hidden>
  <h2>Progress <button type="button" class="help" data-help="progress" aria-label="Help">?</button></h2>
  <div class="stats">
    <div><span>Time</span><b id="time">0.0 s</b></div>
    <div><span>Step</span><b id="stage">-</b></div>
    <div><span>Memory</span><b id="memory">-</b></div>
    <div><span>Storage</span><b id="storage">-</b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <ol class="steps" id="steps"></ol>
  <p id="error" class="err" hidden></p>
</section>

<section class="card" id="result" hidden>
  <h2>Files <button type="button" class="help" data-help="files" aria-label="Help">?</button></h2>
  <p id="summary"></p>
  <div class="row">
    <button id="save" type="button">Save all to a folder</button>
    <button id="zip" type="button">Download all as .zip</button>
    <span id="save-text" class="hint" style="margin:0"></span>
  </div>
  <div class="table"><table><thead><tr><th>File</th><th>Nodes</th><th>Ways</th><th>Relations</th><th>Size</th></tr></thead>
    <tbody id="files"></tbody></table></div>
</section>
</main>
<dialog id="help-box"><h3 id="help-title"></h3><dl id="help-text"></dl>
  <form method="dialog"><button>Close</button></form></dialog>
<script type="module" src="app.js?v=dev"></script>
</body>
</html>
